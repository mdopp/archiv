# Written by `laib-app new` (Werkstatt guide: apps.md). Every app under apps/
# is tested; on main its image is published to ghcr — only after its tests
# are green. Every template under templates/ passes `laib template lint`,
# the same check the box runs before it proposes the service.
name: apps
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.ls.outputs.apps }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: ls
        run: echo "apps=$(ls -d apps/*/ 2>/dev/null | xargs -rn1 basename | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
  test:
    needs: list
    if: needs.list.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: ${{ fromJSON(needs.list.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: hashFiles(format('apps/{0}/go.mod', matrix.app)) != ''
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/${{ matrix.app }}/go.mod
      - name: tests
        run: |
          if [ -f go.mod ]; then go vet ./... && go test ./...
          elif [ -f package.json ]; then npm ci && npm test
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then python3 -m venv .venv && . .venv/bin/activate && pip install -q pytest $( [ -f requirements.txt ] && echo -r requirements.txt ) && pytest -q
          else echo "no tests found for ${{ matrix.app }}: a Werkstatt app ships tests"; exit 1; fi
  # An app with an integration.sh runs it against its image built here:
  # archiv needs a real FUSE mount, signalbackup-tools and msgvault, which
  # `go test` cannot give (apps/archiv/integration.sh says what it proves).
  integration:
    needs: list
    if: needs.list.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: ${{ fromJSON(needs.list.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: has
        run: echo "script=$([ -x apps/${{ matrix.app }}/integration.sh ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.script == 'yes'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - if: steps.has.outputs.script == 'yes'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Containerfile
          load: true
          tags: ${{ matrix.app }}:integration
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - if: steps.has.outputs.script == 'yes'
        run: apps/${{ matrix.app }}/integration.sh ${{ matrix.app }}:integration
  image:
    needs: [list, test, integration]
    if: github.event_name == 'push' && needs.list.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign signs keyless with this workflow's identity (Laib ADR 0034)
    strategy:
      matrix:
        app: ${{ fromJSON(needs.list.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: v
        name: the version Laib shows the family between two images
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Containerfile
          cache-from: type=gha,scope=${{ matrix.app }}
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:latest,ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: sign the image; Laib proposes a new digest of ours only with this signature (Laib ADR 0034)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}@${{ steps.build.outputs.digest }}
  templates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: laib template lint
        run: |
          curl -fsSL -o laib https://github.com/mdopp/laib/releases/latest/download/laib-linux-amd64
          curl -fsSL -o SHA256SUMS https://github.com/mdopp/laib/releases/latest/download/SHA256SUMS
          grep ' laib-linux-amd64$' SHA256SUMS | sed 's/laib-linux-amd64$/laib/' | sha256sum -c -
          chmod +x laib
          for t in templates/*/; do [ -d "$t" ] || continue; ./laib template lint "$t" || exit 1; done
  pins:
    # actions by commit, base images by digest; Dependabot moves them (laib ADR 0034, laib#1165)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/pins.sh
