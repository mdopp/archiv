# Beziehungswörter (archiv#27, owner 2026-11-11): the words that hint at
# how two people relate, in the languages the family writes in. Edit
# freely; the archive reads this file as it is built (woerter.go), and
# `go test` checks it (TestWoerterDatei).
#
# - Each word is one word, letters only (no spaces, no hyphen). Case and
#   umlauts do not matter: „Schwägerin“ also finds „SCHWAEGERIN“ and
#   „Schwagerin“, „kardeşim“ also „kardesim“.
# - beziehung: the kinds a word hints at, as the archive's question
#   names them, seen from the one who writes or saves it: „Mama“ is the
#   writer's Mutter/Vater (eltern). A word may stand under several kinds;
#   the first one it stands under is the suggestion.
#   Kinds: partner, expartner, eltern, kind, geschwister, grosseltern,
#   enkel, onkel (Onkel/Tante), neffe (Neffe/Nichte), cousin,
#   schwiegereltern, schwiegerkind, schwager, verwandt.
# - A word found in a message only sends that message to the box's own
#   model, which judges it; nothing is set without the person's tap.
#   A contact whose name begins with one („Oma Hilde“, „Mama“) gets the
#   suggestion without the model, unless the word is in nicht_im_namen.
# - gruppe: words in a group chat's title that suggest its category; the
#   first category of this list that a title has wins („Eltern 3b“ is an
#   Elterngruppe, not a Klasse). A title with a family word of beziehung
#   („Oma & Opa“) is a Familie.

